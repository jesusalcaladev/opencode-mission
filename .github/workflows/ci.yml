name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: git config --global user.name "opencode-mission-ci"
      - run: git config --global user.email "ci@opencode.local"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run eval
